# xdf-mcp を HTTP モードで常駐させる構成
#
# 使い方:
#   1. .env を編集 (ANTHROPIC_API_KEY、ARCHIVE_DIR を設定)
#   2. 索引が無ければ事前に: docker compose run --rm xdf-mcp xdf-index build /archive --out /index --fresh
#   3. 起動: docker compose up -d
#   4. Claude Desktop / Code から http://localhost:8765/mcp に接続 (パスは XDF_MCP_HTTP_PATH で変更可)

services:
  xdf-mcp:
    image: xdf-fs:latest
    build:
      context: .
    container_name: xdf-mcp
    command: ["xdf-mcp", "--index", "/index", "--http", "0.0.0.0:8765"]
    ports:
      - "${HTTP_PORT:-8765}:8765"
    volumes:
      # アーカイブは read-only bind mount。.env で ARCHIVE_DIR を切替可能
      #
      # propagation: rslave — ARCHIVE_DIR が NFS/SMB のマウントポイントの場合に必須。
      # 既定の rprivate だとコンテナ起動時点の状態が固定されるため、ホスト側で後から
      # mount しても中身が空のまま見える (NAS 停止中にホスト再起動 → NAS 復帰、等)。
      # rslave ならホスト側の mount/umount がコンテナへ伝播するので再起動不要。
      # 前提: ホストの該当パスが shared 伝播であること (systemd 環境では既定で shared)。
      - type: bind
        source: ${ARCHIVE_DIR:-./tests/data}
        target: /archive
        read_only: true
        bind:
          propagation: rslave
      # 索引は named volume (Windows での bind mount 性能対策)
      - type: volume
        source: xdf_index
        target: /index
      # archive_extract が ZIP を書き出すテンポラリ領域 (tmpfs、コンテナ再起動で消える)
      - type: tmpfs
        target: /tmp/xdf-extracts
        tmpfs:
          size: 200000000  # 200 MB (100 MB 上限 × 数件分のバッファ)
    environment:
      # AI 要約バッチ (xdf-index summarize) で使う場合のみ必須
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # rmcp の DNS rebinding 防御で許可する追加ホスト名 (Tailscale serve 等で必須)。
      # 例: .env に XDF_MCP_ALLOWED_HOSTS=myhost.your-tailnet.ts.net を設定。
      # デフォルトの localhost / 127.0.0.1 / ::1 は常に許可される。
      - XDF_MCP_ALLOWED_HOSTS=${XDF_MCP_ALLOWED_HOSTS:-}
      # Streamable HTTP を stateful (セッション) モードにする。既定は stateless。
      # stateful ではセッションがプロセスのメモリ上にしか無く、コンテナを再起動すると
      # 全消えする。古い Mcp-Session-Id を持つクライアントには 404 が返り続け、
      # 「接続はできているのにツール呼び出しだけ全部失敗する」状態になるため、
      # 恒久運用では有効にしないこと。
      # 空文字を渡すと clap が bool として解釈できず起動に失敗するため、既定値を明示する
      - XDF_MCP_STATEFUL=${XDF_MCP_STATEFUL:-false}
      # Bearer token 認証 (Tailscale Funnel 等で公開する場合に必須)。
      # 空なら認証なし。設定時はリクエストに `Authorization: Bearer <token>` 必須。
      # トークン生成例: openssl rand -hex 32
      - XDF_MCP_AUTH_TOKEN=${XDF_MCP_AUTH_TOKEN:-}
      # MCP エンドポイントのパス。Claude Desktop の Custom Connector は OAuth しか
      # 対応していないため、Bearer token の代替として「URL パスを秘密にする」運用が可能:
      # 例: XDF_MCP_HTTP_PATH=/8a3f9c2e7b1d4a5f0123456789abcdef/mcp
      # トークン生成: openssl rand -hex 16
      - XDF_MCP_HTTP_PATH=${XDF_MCP_HTTP_PATH:-/mcp}
      # archive_extract の download_url 組立用の公開 URL prefix。
      # 例: XDF_MCP_PUBLIC_URL=https://myhost.your-tailnet.ts.net/<secret>
      # 空なら download_url は空文字列が返る (output_path のみ)。
      - XDF_MCP_PUBLIC_URL=${XDF_MCP_PUBLIC_URL:-}
    restart: unless-stopped
    # healthcheck は意図的に設定しない。
    #
    # 以前は `test: ["CMD-SHELL", "exit 0"]` を 30 秒間隔で回していた。これは常に成功する
    # no-op で死活情報を一切生まない一方、30 秒ごとにコンテナ内で exec (= runc) を
    # 起こし続ける。2026-10-27、本番 (hp-mini-ws) で containerd の exec 経路が壊れ
    # (`copy stream failed: reading from a closed fifo` /
    #  `timed out starting health check`)、以後 dockerd が失敗した exec を削除できず
    # (`Failed to delete exec process after failing to start: DeadlineExceeded`)、
    # D 状態 (kill -9 不可) の runc が毎分 1 個ずつ漏れ続けた。
    # 約 40 時間で 2,415 個に達し、16GB + swap 4GB を食い潰してホストごと停止した。
    # 得るものが無い検査のために事故経路を常時踏み続ける構成だったため削除する。
    #
    # 死活監視が必要なら exec を使わない外部 / ホスト側からの HTTP 検査にすること。
    # ルートパスへの GET は 404 を返すが、応答が返ること自体が生存の証明になる。
    # 例: curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8765/ → 404 なら生存

volumes:
  xdf_index:
    name: xdf_index
