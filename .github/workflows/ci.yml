name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # png2pic は git 依存なので fetch にネットワークが必要。
      # Cargo.lock で rev 固定済みなので --locked で再現性を担保する。
      - name: cargo build
        run: cargo build --locked --workspace --bins --examples

      # 統合テストは著作権物のディスクイメージを要するため #[ignore] 済み。
      # ここではデータ不要のテストのみが走る。
      - name: cargo test
        run: cargo test --locked --workspace

      # --help はビルド成果物のスモークテストであると同時に、
      # ホスト名等が doc comment 経由でバイナリに焼き込まれていないかの検査でもある。
      - name: --help smoke test
        run: |
          ./target/debug/xdf-mcp --help
          ./target/debug/xdf-index --help
          ./target/debug/examples/xdfls --help

  hygiene:
    name: leak / format checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 公開してはいけないものが混入していないかの回帰検査。
      #
      # 検出したい実際の値 (自分の tailnet 名など) をここに書くと、
      # このファイル自体が公開リポジトリ上でその値を晒すことになる。
      # そのため「値」ではなく「形」で照合する汎用パターンのみを使う。

      # 実在の Tailscale ホスト名。プレースホルダのみ許可する。
      - name: no real tailnet hostnames
        run: |
          if git ls-files -z | xargs -0 grep -InE '[a-z0-9-]+\.[a-z0-9-]+\.ts\.net' | grep -vE 'your-tailnet|example\.ts\.net|<machine>|<tailnet>'; then
            echo '::error::real *.ts.net hostname found — use a placeholder'
            exit 1
          fi

      # API キー / トークンらしき文字列。
      - name: no credentials
        run: |
          if git ls-files -z | xargs -0 grep -InE 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY'; then
            echo '::error::credential-shaped string found'
            exit 1
          fi

      # JASRAC 許諾番号 (著作権物からの逐語引用の指標)。
      - name: no JASRAC licence numbers
        run: |
          if git ls-files -z | xargs -0 grep -InE 'JASRAC[^0-9]{0,20}R-[0-9]{6}|許諾[^0-9]{0,10}R-[0-9]{6}'; then
            echo '::error::real JASRAC licence number found — fixtures must be fictitious'
            exit 1
          fi

      # 著作権物のディスクイメージ / シークレット / 私的ドキュメントが追跡されていないこと。
      - name: no forbidden files tracked
        run: |
          if git ls-files | grep -iE '\.(img|xdf|hds|hdf|dim|d88|2hd)$'; then
            echo '::error::disk image is tracked'
            exit 1
          fi
          if git ls-files | grep -E '^(\.env$|\.claude/|CLAUDE\.md$|docs/additional_spec/)'; then
            echo '::error::private file is tracked'
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 初回は非ブロッキング。グリーンを確認したら continue-on-error を外す。
      - name: cargo fmt
        run: cargo fmt --all --check
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets
        continue-on-error: true

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
